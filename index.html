<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coffee Order</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Coffee Order</h1>

    <form id="orderForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" />
        <small class="error" id="nameError"></small>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="01XXXXXXXXX" />
        <small class="error" id="phoneError"></small>
      </div>

      <div class="field">
        <label for="product">Product</label>
        <select id="product">
          <option value="">Choose a product</option>
          <option value="Espresso" data-price="45">Espresso- 45 EGP</option>
          <option value="Latte" data-price="65">Latte- 65 EGP</option>
          <option value="Croissant" data-price="40">Croissant- 40 EGP</option>
        </select>
        <small class="error" id="productError"></small>
      </div>

      <div class="field">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" min="1" max="10" />
        <small class="error" id="quantityError"></small>
      </div>

      <button type="submit">Order</button>
    </form>

    <div id="orders"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
